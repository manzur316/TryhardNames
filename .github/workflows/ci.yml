name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - chore/pr1-reproducibility-security-clean

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Web tests
        run: npm test

      - name: API tests
        run: npm run test:api

      - name: SEO tests
        run: npm run test:seo

      - name: Gaming Passport domain tests
        run: npm run test:passport

      - name: Build
        run: npm run build
